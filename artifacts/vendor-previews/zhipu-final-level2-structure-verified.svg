<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<rect width="1500" height="1120" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">智谱 AI｜最终二级结构（已核验版）</text><text x="40" y="78" class="s" fill="#5b6577">原 SVG 基线全部保留；新增只保留：2025-07-07 后、官方商业 API/计费可核验的模型</text>
<g transform="translate(40,115)"><rect width="440" height="940" rx="16" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="22" y="40" class="h" fill="#1d4f91">二级：GLM 5（原有基线）</text><rect x="18" y="58" width="404" height="185" rx="10" fill="#d9eaff"/><text x="34" y="90" class="h" fill="#164b8f">原有数据：保留</text><text x="34" y="122" class="b" fill="#164b8f">• GLM-5.3　• GLM-5.2　• GLM-5</text><text x="34" y="149" class="b" fill="#164b8f">• GLM-5.1　• GLM-5-Turbo</text><text x="34" y="176" class="b" fill="#164b8f">• 原有三级卡、工具卡、策略引用</text><text x="34" y="203" class="b" fill="#164b8f">• 原有数据不因新增筛选删除</text><rect x="18" y="263" width="404" height="300" rx="10" fill="#dff7e7"/><text x="34" y="295" class="h" fill="#1d6b3f">二级：图像 / 视频 / 视觉</text><text x="34" y="327" class="b" fill="#1d6b3f">• GLM-Image（$0.015/图）</text><text x="34" y="354" class="b" fill="#1d6b3f">• CogView-4（$0.01/图）</text><text x="34" y="381" class="b" fill="#1d6b3f">• CogVideoX-3（$0.2/视频）</text><text x="34" y="408" class="b" fill="#1d6b3f">• GLM-5V-Turbo · GLM-4.6V</text><text x="34" y="435" class="b" fill="#1d6b3f">• GLM-4.6V-FlashX · GLM-4.6V-Flash</text><text x="34" y="462" class="b" fill="#1d6b3f">• GLM-4.5V · GLM-OCR</text><text x="34" y="489" class="b" fill="#1d6b3f">• GLM-ASR-2512（$0.03/M tokens）</text><text x="34" y="516" class="b" fill="#1d6b3f">• Embedding-2/3（¥0.5/M tokens）</text><rect x="18" y="583" width="404" height="174" rx="10" fill="#fff0d0"/><text x="34" y="615" class="h" fill="#a66100">二级：检索 / 重排（可添加）</text><text x="34" y="647" class="b" fill="#a66100">• Rerank / GLM-rerank（¥0.8/M tokens）</text><text x="34" y="674" class="b" fill="#a66100">• 计费入口为知识库服务，归类时保留来源</text><text x="34" y="701" class="b" fill="#a66100">• 不把未定价的泛 Rerank 名称直接写入</text><rect x="18" y="777" width="404" height="120" rx="10" fill="#e6e8ed"/><text x="34" y="809" class="h" fill="#4f5968">产品 / 工具</text><text x="34" y="841" class="b" fill="#4f5968">• ZCode · AutoClaw · Coding Plan · Agents</text><text x="34" y="868" class="b" fill="#4f5968">• 不作为模型卡</text><rect x="18" y="917" width="404" height="0" fill="none"/></g>
<g transform="translate(530,115)"><rect width="440" height="940" rx="16" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="22" y="40" class="h" fill="#885011">二级：GLM 5.3 Flash（原有基线）</text><rect x="18" y="58" width="404" height="230" rx="10" fill="#ffe9c2"/><text x="34" y="90" class="h" fill="#84520d">原有分组与关联：保留</text><text x="34" y="122" class="b" fill="#84520d">• GLM-5.3 Flash</text><text x="34" y="149" class="b" fill="#84520d">• GLM-5.3 / GLM-5.2 的原有关联记录</text><text x="34" y="176" class="b" fill="#84520d">• 键值、工具卡、日期、共享投影</text><text x="34" y="203" class="b" fill="#84520d">• 只修复规范键，不做删除式替换</text><rect x="18" y="308" width="404" height="285" rx="10" fill="#dff7e7"/><text x="34" y="340" class="h" fill="#1d6b3f">当前官方矩阵可添加</text><text x="34" y="372" class="b" fill="#1d6b3f">• GLM-5V-Turbo · GLM-4.6V · GLM-OCR</text><text x="34" y="399" class="b" fill="#1d6b3f">• GLM-Image · CogView-4 · CogVideoX-3</text><text x="34" y="426" class="b" fill="#1d6b3f">• GLM-ASR-2512 · Embedding-2/3</text><text x="34" y="453" class="b" fill="#1d6b3f">• GLM-rerank / GLM-rerank-pro</text><text x="34" y="480" class="b" fill="#1d6b3f">• GLM-4.5V · GLM-4.6V-FlashX/Flash</text><text x="34" y="507" class="b" fill="#1d6b3f">• 均有 API/价格或免费 API 明确入口</text><rect x="18" y="613" width="404" height="194" rx="10" fill="#ffe2e0"/><text x="34" y="645" class="h" fill="#a12b2b">本轮新增剔除</text><text x="34" y="677" class="b" fill="#a12b2b">• GLM-TTS / GLM-TTS-Clone：只有“去价格页”</text><text x="34" y="704" class="b" fill="#a12b2b">• GLM-Realtime：本轮未核到明确价格</text><text x="34" y="731" class="b" fill="#a12b2b">• Moderation：未核到模型级计费</text><text x="34" y="758" class="b" fill="#a12b2b">• GLM-Z1 / GLM-4-0520：弃用</text><rect x="18" y="827" width="404" height="70" rx="10" fill="#e6e8ed"/><text x="34" y="859" class="b" fill="#4f5968">Vidu Q1/Vidu 2：外部视频产品，不归智谱自有模型</text></g>
<g transform="translate(1020,115)"><rect width="440" height="940" rx="16" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="22" y="40" class="h" fill="#554197">核验依据</text><text x="22" y="92" class="h" fill="#554197">保留原则</text><text x="22" y="124" class="b" fill="#4d4670">原有 SVG 条目不删除；新增必须同时满足：</text><text x="22" y="151" class="b" fill="#4d4670">① 官方 API/商业产品计费可核验</text><text x="22" y="178" class="b" fill="#4d4670">② 处于 14 个月窗口</text><text x="22" y="205" class="b" fill="#4d4670">③ 不是第三方平台接入或仅本地权重</text><text x="22" y="260" class="h" fill="#554197">官方参考</text><text x="22" y="292" class="s" fill="#4d4670">https://docs.z.ai/guides/overview/overview</text><text x="22" y="319" class="s" fill="#4d4670">https://docs.z.ai/guides/overview/pricing</text><text x="22" y="346" class="s" fill="#4d4670">https://docs.bigmodel.cn/cn/guide/tools/knowledge/price</text><text x="22" y="410" class="h" fill="#554197">状态</text><text x="22" y="442" class="b" fill="#4d4670">此图是最终拟定结构，不自动改目录。</text><text x="22" y="469" class="b" fill="#4d4670">未能确认计费的新增项已从 active 区移除。</text><text x="22" y="496" class="b" fill="#4d4670">原有数据仍在基线/关联区展示。</text></g></svg>
