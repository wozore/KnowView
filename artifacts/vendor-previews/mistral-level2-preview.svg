<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc">
  <title id="title">Mistral AI 二级结构预览（现有 / 候选 / 待确认）</title>
  <desc id="desc">只读探测预览，不代表已批准的正式目录变更。调查日期 2026-09-07，计划 cutoff 2025-07-01。</desc>
  <style>
    .bg{fill:#f7f8fa}.title{font:700 34px sans-serif;fill:#172033}.subtitle{font:16px sans-serif;fill:#526070}.section{font:700 23px sans-serif;fill:#172033}.label{font:700 17px sans-serif;fill:#172033}.body{font:15px sans-serif;fill:#293548}.small{font:13px sans-serif;fill:#526070}.tiny{font:12px sans-serif;fill:#526070}.card{fill:#fff;stroke:#d5dbe5;stroke-width:2}.existing{fill:#ecfdf3;stroke:#36a269;stroke-width:2}.candidate{fill:#eff6ff;stroke:#4d86d9;stroke-width:2}.pending{fill:#fff8e6;stroke:#d99b21;stroke-width:2}.excluded{fill:#fff1f2;stroke:#d05b66;stroke-width:2}.product{fill:#f5f0ff;stroke:#8b6bcc;stroke-width:2}.line{stroke:#7b8797;stroke-width:2;fill:none}.dash{stroke:#d99b21;stroke-width:2;stroke-dasharray:8 7;fill:none}.pill-existing{fill:#36a269}.pill-candidate{fill:#4d86d9}.pill-pending{fill:#d99b21}.pill-excluded{fill:#d05b66}.pill-product{fill:#8b6bcc}.pilltext{font:700 12px sans-serif;fill:#fff}.url{font:12px monospace;fill:#315d9c}
