  <g transform="translate(1000 470)">
    <rect class="existing" width="700" height="110" rx="14"/>
    <rect x="20" y="17" width="82" height="25" rx="12" class="pill-existing"/><text x="61" y="35" text-anchor="middle" class="pilltext">现有</text>
    <text x="122" y="37" class="label">Mistral Large 3</text>
    <text x="20" y="66" class="body">api_model · tool-level3:mistral-large-3 · tool card 已存在</text>
    <text x="20" y="88" class="small">开放权重多模态 · 官方页面 v25.12 · $0.5 / $1.5 每百万 tokens</text>
