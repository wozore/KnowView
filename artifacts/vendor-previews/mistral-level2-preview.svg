    <rect x="20" y="16" width="82" height="25" rx="12" class="pill-existing"/><text x="61" y="34" text-anchor="middle" class="pilltext">现有</text>
    <text x="122" y="36" class="label">Mistral 模型</text>
    <text x="20" y="65" class="small">vendor-level2:mistral:mistral · active · detail_refs = 2</text>
    <text x="20" y="84" class="url">https://mistral.ai/pricing/api/</text>
  </g>
  <path d="M900 428 L900 470" class="line"/>
  <g transform="translate(100 470)">
