  <rect class="bg" width="1800" height="1900"/>
  <text x="70" y="65" class="title">Mistral AI · 二级结构预览</text>
  <text x="70" y="98" class="subtitle">只读探测产物 · 调查日期 2026-09-07 · cutoff 2025-07-01 · 不代表正式目录已批准</text>

  <g transform="translate(70 135)">
    <rect class="card" width="1660" height="112" rx="14"/>
    <text x="24" y="34" class="section">图例</text>
    <rect x="120" y="17" width="82" height="25" rx="12" class="pill-existing"/><text x="161" y="35" text-anchor="middle" class="pilltext">现有</text>
    <rect x="225" y="17" width="82" height="25" rx="12" class="pill-candidate"/><text x="266" y="35" text-anchor="middle" class="pilltext">候选</text>
    <rect x="330" y="17" width="82" height="25" rx="12" class="pill-pending"/><text x="371" y="35" text-anchor="middle" class="pilltext">待确认</text>
    <rect x="435" y="17" width="82" height="25" rx="12" class="pill-excluded"/><text x="476" y="35" text-anchor="middle" class="pilltext">排除/下线</text>
    <rect x="540" y="17" width="82" height="25" rx="12" class="pill-product"/><text x="581" y="35" text-anchor="middle" class="pilltext">产品/工具</text>
    <text x="24" y="75" class="small">项目现状：vendor-level2:mistral:mistral 目前只引用 Mistral Medium 3.5 与 Mistral Large 3。</text>
    <text x="24" y="96" class="small">本图把模型卡、产品/工具、生命周期冲突和 cutoff 排除项分开，未写入 catalog、policy、registry 或 shared projection。</text>
  </g>

  <text x="70" y="310" class="section">现有二级卡片（正式目录当前状态）</text>
  <path d="M900 330 L900 390" class="line"/>
  <g transform="translate(600 330)">
