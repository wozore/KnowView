    <text x="20" y="88" class="small">多模态 / agentic / coding · 官方页面 v26.04 · $1.5 / $7.5 每百万 tokens</text>
    <text x="20" y="103" class="url">https://docs.mistral.ai/models/mistral-medium-3-5-26-04</text>
