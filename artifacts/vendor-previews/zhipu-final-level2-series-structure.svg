<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect width="1600" height="1180" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">智谱 AI｜最终系列化二级结构</text><text x="40" y="77" class="s" fill="#5b6577">原 SVG 数据保留；“GLM 5.3 Flash”重命名为“GLM Flash”；新增只纳入已核验计费且未过 14 个月窗口的模型</text>
<g transform="translate(40,115)"><rect width="360" height="950" rx="15" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d4f91">GLM（通用）</text><rect x="15" y="55" width="330" height="205" rx="9" fill="#d9eaff"/><text x="28" y="86" class="h" fill="#164b8f">原有保留</text><text x="28" y="116" class="b" fill="#164b8f">GLM-5.3 · GLM-5.2 · GLM-5</text><text x="28" y="142" class="b" fill="#164b8f">GLM-5.1 · GLM-5-Turbo</text><text x="28" y="168" class="b" fill="#164b8f">原有三级/工具/策略引用</text><text x="28" y="194" class="b" fill="#164b8f">不因筛选规则删除</text><rect x="15" y="280" width="330" height="200" rx="9" fill="#dff7e7"/><text x="28" y="311" class="h" fill="#1d6b3f">可选择添加</text><text x="28" y="341" class="b" fill="#1d6b3f">GLM-4.7 · GLM-4.6 · GLM-4.5</text><text x="28" y="367" class="b" fill="#1d6b3f">GLM-4.5-X · Air · AirX</text><text x="28" y="393" class="b" fill="#1d6b3f">GLM-4-32B-0414-128K</text><text x="28" y="419" class="b" fill="#1d6b3f">官方 API/价格可查</text><rect x="15" y="500" width="330" height="240" rx="9" fill="#e6e8ed"/><text x="28" y="531" class="h" fill="#4f5968">产品/工具</text><text x="28" y="561" class="b" fill="#4f5968">ZCode · AutoClaw</text><text x="28" y="587" class="b" fill="#4f5968">Coding Plan · Agents</text><text x="28" y="613" class="b" fill="#4f5968">不作为模型卡</text><rect x="15" y="760" width="330" height="150" rx="9" fill="#ffe2e0"/><text x="28" y="791" class="h" fill="#a12b2b">新增剔除</text><text x="28" y="821" class="b" fill="#a12b2b">GLM-Z1 · GLM-4-0520</text><text x="28" y="847" class="b" fill="#a12b2b">已弃用/过期模型</text></g>
<g transform="translate(420,115)"><rect width="360" height="950" rx="15" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="20" y="38" class="h" fill="#885011">GLM Flash（原 GLM 5.3 Flash）</text><rect x="15" y="55" width="330" height="220" rx="9" fill="#ffe9c2"/><text x="28" y="86" class="h" fill="#84520d">原有系列保留</text><text x="28" y="116" class="b" fill="#84520d">GLM-5.3 Flash</text><text x="28" y="142" class="b" fill="#84520d">原有 Flash 工具卡与关联引用</text><text x="28" y="168" class="b" fill="#84520d">系列名统一为 GLM Flash</text><rect x="15" y="295" width="330" height="250" rx="9" fill="#dff7e7"/><text x="28" y="326" class="h" fill="#1d6b3f">并入系列</text><text x="28" y="356" class="b" fill="#1d6b3f">GLM-4.7 Flash（官方免费 API）</text><text x="28" y="382" class="b" fill="#1d6b3f">GLM-4.6V-Flash</text><text x="28" y="408" class="b" fill="#1d6b3f">GLM-4.6V-FlashX</text><text x="28" y="434" class="b" fill="#1d6b3f">同系列展示，避免空荡</text><text x="28" y="460" class="s" fill="#1d6b3f">免费 API 仍是官方商业服务入口</text><rect x="15" y="565" width="330" height="160" rx="9" fill="#ffe2e0"/><text x="28" y="596" class="h" fill="#a12b2b">剔除</text><text x="28" y="626" class="b" fill="#a12b2b">GLM-4.5-Flash：生命周期需排除</text><text x="28" y="652" class="b" fill="#a12b2b">旧版/停用 Flash 变体</text></g>
<g transform="translate(800,115)"><rect width="360" height="950" rx="15" fill="#f0fff4" stroke="#65b987" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d6b3f">图像 / 视频 / 视觉</text><rect x="15" y="55" width="330" height="180" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">图像</text><text x="28" y="116" class="b" fill="#1d6b3f">GLM-Image（$0.015/图）</text><text x="28" y="142" class="b" fill="#1d6b3f">CogView-4（$0.01/图）</text><rect x="15" y="255" width="330" height="150" rx="9" fill="#dff7e7"/><text x="28" y="286" class="h" fill="#1d6b3f">视频</text><text x="28" y="316" class="b" fill="#1d6b3f">CogVideoX-3（$0.2/视频）</text><text x="28" y="342" class="b" fill="#1d6b3f">Vidu：外部产品，不归智谱自有模型</text><rect x="15" y="425" width="330" height="250" rx="9" fill="#dff7e7"/><text x="28" y="456" class="h" fill="#1d6b3f">视觉</text><text x="28" y="486" class="b" fill="#1d6b3f">GLM-5V-Turbo · GLM-4.6V</text><text x="28" y="512" class="b" fill="#1d6b3f">GLM-4.5V · GLM-OCR</text><text x="28" y="538" class="b" fill="#1d6b3f">均有官方模型/价格入口</text><rect x="15" y="695" width="330" height="215" rx="9" fill="#ffe2e0"/><text x="28" y="726" class="h" fill="#a12b2b">新增剔除</text><text x="28" y="756" class="b" fill="#a12b2b">无价格或过期模型不进入 active</text><text x="28" y="782" class="b" fill="#a12b2b">GLM-TTS / Clone：未列明确价格</text><text x="28" y="808" class="b" fill="#a12b2b">GLM-Realtime：未核到明确价格</text></g>
<g transform="translate(1180,115)"><rect width="360" height="950" rx="15" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="20" y="38" class="h" fill="#554197">音频 / 检索 / 来源</text><rect x="15" y="55" width="330" height="170" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">音频</text><text x="28" y="116" class="b" fill="#1d6b3f">GLM-ASR-2512（$0.03/M tokens）</text><text x="28" y="142" class="b" fill="#1d6b3f">可作为音频三级模型</text><rect x="15" y="245" width="330" height="180" rx="9" fill="#dff7e7"/><text x="28" y="276" class="h" fill="#1d6b3f">Embedding / Rerank</text><text x="28" y="306" class="b" fill="#1d6b3f">Embedding-2 · Embedding-3</text><text x="28" y="332" class="b" fill="#1d6b3f">GLM-rerank / GLM-rerank-pro</text><text x="28" y="358" class="b" fill="#1d6b3f">有官方知识库计费</text><rect x="15" y="445" width="330" height="245" rx="9" fill="#e6e8ed"/><text x="28" y="476" class="h" fill="#4f5968">官方参考</text><text x="28" y="508" class="s" fill="#4f5968">docs.z.ai/guides/overview/overview</text><text x="28" y="535" class="s" fill="#4f5968">docs.z.ai/guides/overview/pricing</text><text x="28" y="562" class="s" fill="#4f5968">docs.bigmodel.cn/cn/guide/tools/knowledge/price</text><text x="28" y="615" class="b" fill="#4f5968">图为拟定结构，不自动写目录</text></g></svg>
