<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect width="1600" height="1180" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">文心 / 百度｜最终系列化二级结构</text><text x="40" y="77" class="s" fill="#5b6577">ERNIE 与 ERNIE X 分开；Preview 当前仍可调用，因此保留并与正式版并列；不同模态独立成系列</text>
<g transform="translate(40,115)"><rect width="360" height="950" rx="15" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="20" y="38" class="h" fill="#885011">ERNIE（通用 / 原生多模态）</text><rect x="15" y="55" width="330" height="220" rx="9" fill="#ffe9c2"/><text x="28" y="86" class="h" fill="#84520d">原有保留</text><text x="28" y="116" class="b" fill="#84520d">ERNIE 5.1 · ERNIE 5.0</text><text x="28" y="142" class="b" fill="#84520d">ERNIE 4.5 Turbo 128K</text><text x="28" y="168" class="b" fill="#84520d">Thinking Preview / Latest 变体</text><text x="28" y="194" class="b" fill="#84520d">原有卡片与共享引用保留</text><rect x="15" y="295" width="330" height="190" rx="9" fill="#dff7e7"/><text x="28" y="326" class="h" fill="#1d6b3f">官方计费可选择添加</text><text x="28" y="356" class="b" fill="#1d6b3f">ERNIE 5.1（¥0.004/千 tokens 起）</text><text x="28" y="382" class="b" fill="#1d6b3f">ERNIE 5.0（¥0.006/千 tokens 起）</text><text x="28" y="408" class="b" fill="#1d6b3f">ERNIE 4.5 Turbo 128K</text><text x="28" y="434" class="b" fill="#1d6b3f">官方价格页有输入/输出计费</text><rect x="15" y="505" width="330" height="220" rx="9" fill="#e6e8ed"/><text x="28" y="536" class="h" fill="#4f5968">说明</text><text x="28" y="566" class="b" fill="#4f5968">ERNIE 5.0 是原生全模态</text><text x="28" y="592" class="b" fill="#4f5968">但仍归通用 ERNIE 系列</text><text x="28" y="618" class="b" fill="#4f5968">视觉能力另在“视觉”系列展示</text></g>
<g transform="translate(420,115)"><rect width="360" height="950" rx="15" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d4f91">ERNIE X（推理）</text><rect x="15" y="55" width="330" height="245" rx="9" fill="#d9eaff"/><text x="28" y="86" class="h" fill="#164b8f">当前可用：保留</text><text x="28" y="116" class="b" fill="#164b8f">ERNIE X1.1（正式版）</text><text x="28" y="142" class="b" fill="#164b8f">ERNIE X1.1 Preview（仍可调用）</text><text x="28" y="168" class="b" fill="#164b8f">Preview 与正式版均在当前 API 列表</text><text x="28" y="194" class="b" fill="#164b8f">Preview 有 pricing 字段，不丢弃</text><text x="28" y="238" class="s" fill="#49627f">X1 Turbo 旧 Preview/Latest：按退役表排除</text><rect x="15" y="325" width="330" height="200" rx="9" fill="#dff7e7"/><text x="28" y="356" class="h" fill="#1d6b3f">计费 / API</text><text x="28" y="386" class="b" fill="#1d6b3f">ernie-x1.1 / ernie-x1.1-preview</text><text x="28" y="412" class="b" fill="#1d6b3f">当前模型列表与 API 可发现</text><text x="28" y="438" class="b" fill="#1d6b3f">独立二级系列，不并入 ERNIE</text><rect x="15" y="550" width="330" height="200" rx="9" fill="#ffe2e0"/><text x="28" y="581" class="h" fill="#a12b2b">剔除</text><text x="28" y="611" class="b" fill="#a12b2b">ERNIE-X1-Turbo-32K</text><text x="28" y="637" class="b" fill="#a12b2b">ERNIE-X1-Turbo-Preview/Latest</text><text x="28" y="663" class="b" fill="#a12b2b">官方退役记录已有明确日期</text></g>
<g transform="translate(800,115)"><rect width="360" height="950" rx="15" fill="#f0fff4" stroke="#65b987" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d6b3f">视觉 / 图像 / 视频</text><rect x="15" y="55" width="330" height="220" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">视觉</text><text x="28" y="116" class="b" fill="#1d6b3f">ERNIE 4.5 Turbo VL（¥0.003/千 tokens）</text><text x="28" y="142" class="b" fill="#1d6b3f">ERNIE 5.0 原生多模态</text><text x="28" y="168" class="b" fill="#1d6b3f">32K/128K 版本按官方价格区分</text><rect x="15" y="295" width="330" height="180" rx="9" fill="#dff7e7"/><text x="28" y="326" class="h" fill="#1d6b3f">图像</text><text x="28" y="356" class="b" fill="#1d6b3f">MuseSteamer Air Image（¥0.05/张）</text><text x="28" y="382" class="b" fill="#1d6b3f">ERNIE-iRAG：产品能力单列</text><text x="28" y="408" class="b" fill="#1d6b3f">不与基础模型混为一类</text><rect x="15" y="495" width="330" height="180" rx="9" fill="#ffe2e0"/><text x="28" y="526" class="h" fill="#a12b2b">视频</text><text x="28" y="556" class="b" fill="#a12b2b">MuseSteamer 2.x：本轮未核到明确官方单价</text><text x="28" y="583" class="b" fill="#a12b2b">不进入 active，保留为原 SVG 审计项</text><rect x="15" y="695" width="330" height="215" rx="9" fill="#e6e8ed"/><text x="28" y="726" class="h" fill="#4f5968">产品 / 工具</text><text x="28" y="756" class="b" fill="#4f5968">AppBuilder · Agent · Coding Plan</text><text x="28" y="782" class="b" fill="#4f5968">语音服务 · 内容安全</text><text x="28" y="808" class="b" fill="#4f5968">按平台能力处理，不直接建模型卡</text></g>
<g transform="translate(1180,115)"><rect width="360" height="950" rx="15" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="20" y="38" class="h" fill="#554197">OCR / Embedding / Rerank</text><rect x="15" y="55" width="330" height="220" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">向量 / 重排</text><text x="28" y="116" class="b" fill="#1d6b3f">Embedding-V1（¥0.0005/千 tokens）</text><text x="28" y="142" class="b" fill="#1d6b3f">tao-8k（¥0.0005/千 tokens）</text><text x="28" y="168" class="b" fill="#1d6b3f">bce-reranker-base（付费托管）</text><text x="28" y="194" class="b" fill="#1d6b3f">bce 标注为第三方，不归百度自研</text><rect x="15" y="295" width="330" height="210" rx="9" fill="#ffe2e0"/><text x="28" y="326" class="h" fill="#a12b2b">OCR / 开源候选</text><text x="28" y="356" class="b" fill="#a12b2b">Qianfan-OCR / OCR-Fast</text><text x="28" y="382" class="b" fill="#a12b2b">Qianfan-VL-8B/70B</text><text x="28" y="408" class="b" fill="#a12b2b">官方退役表或仅开源/训练价格</text><text x="28" y="434" class="b" fill="#a12b2b">不进入 active</text><rect x="15" y="525" width="330" height="235" rx="9" fill="#e6e8ed"/><text x="28" y="556" class="h" fill="#4f5968">官方参考</text><text x="28" y="586" class="s" fill="#4f5968">cloud.baidu.com/doc/qianfan/s/rmh4stp0j</text><text x="28" y="613" class="s" fill="#4f5968">cloud.baidu.com/doc/qianfan-api/s/Dmba8k71y</text><text x="28" y="640" class="s" fill="#4f5968">cloud.baidu.com/doc/qianfan/s/zmh4stou3</text><text x="28" y="695" class="b" fill="#4f5968">Preview 只有在当前 API 可用时保留</text><text x="28" y="722" class="b" fill="#4f5968">本图为拟定结构，不自动写目录</text></g></svg>
