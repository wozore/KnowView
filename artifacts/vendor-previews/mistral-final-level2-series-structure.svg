<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<rect width="1600" height="1180" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">Mistral AI｜最终系列化二级结构</text><text x="40" y="77" class="s" fill="#5b6577">通用、视觉、图像、视频、OCR、音频、代码、安全、Embedding 分开；无自有图像/视频模型则明确留空</text>
<g transform="translate(40,115)"><rect width="360" height="950" rx="15" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="20" y="38" class="h" fill="#554197">通用 / 多模态</text><rect x="15" y="55" width="330" height="240" rx="9" fill="#d9d2ff"/><text x="28" y="86" class="h" fill="#554197">原有/当前保留</text><text x="28" y="116" class="b" fill="#554197">Mistral Medium 3.5 · Large 3</text><text x="28" y="142" class="b" fill="#554197">Mistral Small 4</text><text x="28" y="168" class="b" fill="#554197">Ministral 3 3B/8B/14B</text><text x="28" y="194" class="b" fill="#554197">视觉输入由这些多模态模型承担</text><text x="28" y="234" class="s" fill="#665f7b">均有官方 API 价格；开放权重不等于本地-only</text><rect x="15" y="315" width="330" height="190" rx="9" fill="#ffe2e0"/><text x="28" y="346" class="h" fill="#a12b2b">第三方托管（不归 Mistral 自有）</text><text x="28" y="376" class="b" fill="#a12b2b">Z.ai GLM 5.2</text><text x="28" y="402" class="b" fill="#a12b2b">虽然有 Mistral 托管价格</text><text x="28" y="428" class="b" fill="#a12b2b">但厂商归属应为智谱</text><rect x="15" y="525" width="330" height="215" rx="9" fill="#e6e8ed"/><text x="28" y="556" class="h" fill="#4f5968">产品 / 平台</text><text x="28" y="586" class="b" fill="#4f5968">Vibe · Studio · Agents</text><text x="28" y="612" class="b" fill="#4f5968">Forge · Compute</text><text x="28" y="638" class="b" fill="#4f5968">图像生成工具使用外部模型</text></g>
<g transform="translate(420,115)"><rect width="360" height="950" rx="15" fill="#f0fff4" stroke="#65b987" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d6b3f">视觉 / 图像 / 视频</text><rect x="15" y="55" width="330" height="180" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">视觉</text><text x="28" y="116" class="b" fill="#1d6b3f">Medium 3.5 · Large 3 · Small 4</text><text x="28" y="142" class="b" fill="#1d6b3f">Ministral 3 系列</text><text x="28" y="168" class="b" fill="#1d6b3f">官方 Multimodal/vision 能力</text><rect x="15" y="255" width="330" height="180" rx="9" fill="#e6e8ed"/><text x="28" y="286" class="h" fill="#4f5968">图像</text><text x="28" y="316" class="b" fill="#4f5968">暂无 Mistral 自有图像生成模型</text><text x="28" y="342" class="b" fill="#4f5968">Agent image_generation 使用外部模型</text><rect x="15" y="455" width="330" height="180" rx="9" fill="#e6e8ed"/><text x="28" y="486" class="h" fill="#4f5968">视频</text><text x="28" y="516" class="b" fill="#4f5968">暂无官方独立视频模型/API</text><text x="28" y="542" class="b" fill="#4f5968">不虚构视频模型卡</text><rect x="15" y="655" width="330" height="170" rx="9" fill="#ffe2e0"/><text x="28" y="686" class="h" fill="#a12b2b">不纳入</text><text x="28" y="716" class="b" fill="#a12b2b">外部 Black Forest Labs 等模型</text><text x="28" y="742" class="b" fill="#a12b2b">不是 Mistral 自有模型</text></g>
<g transform="translate(800,115)"><rect width="360" height="950" rx="15" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="20" y="38" class="h" fill="#1d4f91">OCR / 音频</text><rect x="15" y="55" width="330" height="245" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">OCR：可选择添加</text><text x="28" y="116" class="b" fill="#1d6b3f">OCR 3（生产可用）</text><text x="28" y="142" class="b" fill="#1d6b3f">OCR 4.0（$4/1000 pages）</text><text x="28" y="168" class="b" fill="#1d6b3f">OCR 4.1（$4/1000 pages）</text><text x="28" y="194" class="b" fill="#1d6b3f">均为窗口内现行服务</text><rect x="15" y="320" width="330" height="290" rx="9" fill="#dff7e7"/><text x="28" y="351" class="h" fill="#1d6b3f">音频：可选择添加</text><text x="28" y="381" class="b" fill="#1d6b3f">Voxtral Small（$0.004/min）</text><text x="28" y="407" class="b" fill="#1d6b3f">Mini Transcribe 2（$0.003/min）</text><text x="28" y="433" class="b" fill="#1d6b3f">Mini Transcribe Realtime（$0.006/min）</text><text x="28" y="459" class="b" fill="#1d6b3f">Voxtral TTS（$16/M chars output）</text><text x="28" y="485" class="b" fill="#1d6b3f">音频模型独立于通用视觉系列</text><rect x="15" y="630" width="330" height="190" rx="9" fill="#e6e8ed"/><text x="28" y="661" class="h" fill="#4f5968">官方价格</text><text x="28" y="691" class="s" fill="#4f5968">docs.mistral.ai/inference/pricing</text><text x="28" y="718" class="s" fill="#4f5968">docs.mistral.ai/models</text></g>
<g transform="translate(1180,115)"><rect width="360" height="950" rx="15" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="20" y="38" class="h" fill="#885011">代码 / 安全 / 历史</text><rect x="15" y="55" width="330" height="190" rx="9" fill="#dff7e7"/><text x="28" y="86" class="h" fill="#1d6b3f">代码</text><text x="28" y="116" class="b" fill="#1d6b3f">Codestral（当前版本有 $0.3/$0.9 价格）</text><text x="28" y="142" class="b" fill="#1d6b3f">旧版 Codestral 25.01/24.05 不新增</text><text x="28" y="168" class="b" fill="#1d6b3f">旧版已 retired</text><rect x="15" y="265" width="330" height="165" rx="9" fill="#dff7e7"/><text x="28" y="296" class="h" fill="#1d6b3f">安全</text><text x="28" y="326" class="b" fill="#1d6b3f">Mistral Moderation 2（Free API）</text><text x="28" y="352" class="b" fill="#1d6b3f">独立安全/分类系列</text><rect x="15" y="450" width="330" height="260" rx="9" fill="#ffe2e0"/><text x="28" y="481" class="h" fill="#a12b2b">历史排除</text><text x="28" y="511" class="b" fill="#a12b2b">Shieldstral 1.0：无商业计费证据</text><text x="28" y="537" class="b" fill="#a12b2b">Devstral 2：Deprecated</text><text x="28" y="563" class="b" fill="#a12b2b">Leanstral 1.5：生命周期冲突</text><text x="28" y="589" class="b" fill="#a12b2b">Codestral Embed/Mistral Embed：早于窗口</text><text x="28" y="615" class="b" fill="#a12b2b">仅本地/无官方价格模型</text><rect x="15" y="730" width="330" height="90" rx="9" fill="#e6e8ed"/><text x="28" y="762" class="b" fill="#4f5968">本图为拟定结构，不自动改目录</text></g></svg>
