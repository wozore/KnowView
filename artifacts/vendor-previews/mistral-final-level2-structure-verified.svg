<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<rect width="1500" height="1120" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">Mistral AI｜最终二级结构（已核验版）</text><text x="40" y="78" class="s" fill="#5b6577">原 SVG 基线全部保留；新增只保留官方 API/价格可核验且在 14 个月窗口内的模型</text>
<g transform="translate(40,115)"><rect width="440" height="940" rx="16" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="22" y="40" class="h" fill="#554197">二级：通用 / 多模态（原有基线）</text><rect x="18" y="58" width="404" height="230" rx="10" fill="#e1dcff"/><text x="34" y="90" class="h" fill="#554197">原有与当前付费 API：保留</text><text x="34" y="122" class="b" fill="#554197">• Mistral Medium 3.5 · Large 3</text><text x="34" y="149" class="b" fill="#554197">• Mistral Small 4</text><text x="34" y="176" class="b" fill="#554197">• Ministral 3 3B / 8B / 14B</text><text x="34" y="203" class="b" fill="#554197">• 视觉能力由上述多模态模型承担</text><text x="34" y="246" class="s" fill="#665f7b">官方价格：Medium/Large/Small/Ministral 均有 API 单价</text><rect x="18" y="308" width="404" height="210" rx="10" fill="#dff7e7"/><text x="34" y="340" class="h" fill="#1d6b3f">代码 / Embedding</text><text x="34" y="372" class="b" fill="#1d6b3f">• Codestral（当前 25.08 版，$0.3/$0.9 M tokens）</text><text x="34" y="399" class="b" fill="#1d6b3f">• Codestral Embed（有 $0.15/M tokens，但早于窗口）</text><text x="34" y="426" class="b" fill="#1d6b3f">• Mistral Embed（有 $0.1/M tokens，但早于窗口）</text><text x="34" y="453" class="b" fill="#a12b2b">• 两个旧 Embedding 不进入本轮新增 active</text><rect x="18" y="538" width="404" height="220" rx="10" fill="#dff7e7"/><text x="34" y="570" class="h" fill="#1d6b3f">视觉 / OCR：可选择添加</text><text x="34" y="602" class="b" fill="#1d6b3f">• OCR 3 · OCR 4.0 · OCR 4.1</text><text x="34" y="629" class="b" fill="#1d6b3f">• OCR 4.0/4.1：$4/1000 pages</text><text x="34" y="656" class="b" fill="#1d6b3f">• OCR 3：仍可用于现有生产工作负载</text><text x="34" y="683" class="b" fill="#1d6b3f">• 图像理解由 Medium/Large/Small/Ministral 承担</text><rect x="18" y="778" width="404" height="120" rx="10" fill="#e6e8ed"/><text x="34" y="810" class="h" fill="#4f5968">产品 / 工具</text><text x="34" y="842" class="b" fill="#4f5968">• Vibe · Studio · Agents · Forge · Compute</text><text x="34" y="869" class="b" fill="#4f5968">• image_generation 使用外部模型，不作为 Mistral 图像卡</text></g>
<g transform="translate(530,115)"><rect width="440" height="940" rx="16" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="22" y="40" class="h" fill="#1d4f91">二级：音频 / 语音 / 安全</text><rect x="18" y="58" width="404" height="310" rx="10" fill="#dff7e7"/><text x="34" y="90" class="h" fill="#1d6b3f">官方价格已核验：可选择添加</text><text x="34" y="122" class="b" fill="#1d6b3f">• Voxtral Small（$0.004/min + token 价格）</text><text x="34" y="149" class="b" fill="#1d6b3f">• Voxtral Mini Transcribe 2（$0.003/min）</text><text x="34" y="176" class="b" fill="#1d6b3f">• Voxtral Mini Transcribe Realtime（$0.006/min）</text><text x="34" y="203" class="b" fill="#1d6b3f">• Voxtral TTS（$16/M chars output）</text><text x="34" y="230" class="b" fill="#1d6b3f">• Mistral Moderation 2（Free 官方 API）</text><text x="34" y="257" class="b" fill="#1d6b3f">• 均为窗口内当前模型/服务</text><rect x="18" y="388" width="404" height="210" rx="10" fill="#ffe2e0"/><text x="34" y="420" class="h" fill="#a12b2b">本轮剔除</text><text x="34" y="452" class="b" fill="#a12b2b">• Shieldstral 1.0：只有权重/开源资料，无商业价格</text><text x="34" y="479" class="b" fill="#a12b2b">• Devstral 2：官方 Deprecated</text><text x="34" y="506" class="b" fill="#a12b2b">• Leanstral 1.5：Labs/Free，生命周期存在退役冲突</text><text x="34" y="533" class="b" fill="#a12b2b">• Codestral Embed / Mistral Embed：早于窗口</text><rect x="18" y="618" width="404" height="280" rx="10" fill="#e6e8ed"/><text x="34" y="650" class="h" fill="#4f5968">边界</text><text x="34" y="682" class="b" fill="#4f5968">• 开放权重不自动排除：有官方商业 API 可保留</text><text x="34" y="709" class="b" fill="#4f5968">• 仅本地且无商业计费：排除</text><text x="34" y="736" class="b" fill="#4f5968">• 产品/平台/外部图像模型：不作为模型卡</text><text x="34" y="783" class="s" fill="#4f5968">官方价格：https://docs.mistral.ai/inference/pricing</text><text x="34" y="810" class="s" fill="#4f5968">模型总览：https://docs.mistral.ai/models</text></g>
<g transform="translate(1020,115)"><rect width="440" height="940" rx="16" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="22" y="40" class="h" fill="#885011">原 SVG 条目审计结果</text><rect x="18" y="58" width="404" height="250" rx="10" fill="#d9eaff"/><text x="34" y="90" class="h" fill="#164b8f">原有/当前保留</text><text x="34" y="122" class="b" fill="#164b8f">• Medium 3.5 · Large 3 · Small 4</text><text x="34" y="149" class="b" fill="#164b8f">• Ministral 3 系列</text><text x="34" y="176" class="b" fill="#164b8f">• OCR、Voxtral、Moderation 的现有关系</text><text x="34" y="203" class="b" fill="#164b8f">• 工具卡和产品边界</text><text x="34" y="246" class="s" fill="#49627f">原有数据不被候选筛选覆盖</text><rect x="18" y="328" width="404" height="216" rx="10" fill="#ffe2e0"/><text x="34" y="360" class="h" fill="#a12b2b">历史/新增排除</text><text x="34" y="392" class="b" fill="#a12b2b">• 旧 Codestral 25.01 / 24.05：retired</text><text x="34" y="419" class="b" fill="#a12b2b">• OCR 旧版本若不在 3/4.0/4.1：不新增</text><text x="34" y="446" class="b" fill="#a12b2b">• Shieldstral：无商业计费</text><text x="34" y="473" class="b" fill="#a12b2b">• Devstral 2 / Leanstral 1.5：生命周期冲突</text><rect x="18" y="564" width="404" height="334" rx="10" fill="#e6e8ed"/><text x="34" y="596" class="h" fill="#4f5968">最终准入规则</text><text x="34" y="628" class="b" fill="#4f5968">① 官方 API/商业价格或明确 Free API</text><text x="34" y="655" class="b" fill="#4f5968">② 发布时间在 2025-07-07 之后或当前仍有效</text><text x="34" y="682" class="b" fill="#4f5968">③ 不是仅本地权重、不是已弃用</text><text x="34" y="736" class="b" fill="#4f5968">本图为最终拟定结构，不自动改目录。</text><text x="34" y="763" class="s" fill="#4f5968">来源：https://docs.mistral.ai/models</text><text x="34" y="790" class="s" fill="#4f5968">来源：https://docs.mistral.ai/inference/pricing</text></g></svg>
