<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<rect width="1500" height="1120" fill="#f7f8fa"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:13px}</style>
<text x="40" y="48" class="t" fill="#172033">文心 / 百度｜最终二级结构（已核验版）</text><text x="40" y="78" class="s" fill="#5b6577">原 SVG 基线全部保留；新增只保留官方推理/产品计费可核验且未过 14 个月窗口的条目</text>
<g transform="translate(40,115)"><rect width="440" height="940" rx="16" fill="#fff8ed" stroke="#e0a557" stroke-width="2"/><text x="22" y="40" class="h" fill="#885011">二级：ERNIE（原有基线）</text><rect x="18" y="58" width="404" height="230" rx="10" fill="#ffe9c2"/><text x="34" y="90" class="h" fill="#84520d">原有数据：保留</text><text x="34" y="122" class="b" fill="#84520d">• ERNIE 5.1　• ERNIE 5.0</text><text x="34" y="149" class="b" fill="#84520d">• ERNIE X1.1 / X1.1 Preview（原 SVG 基线）</text><text x="34" y="176" class="b" fill="#84520d">• ERNIE 4.5 Turbo 128K（原有/现行计费）</text><text x="34" y="203" class="b" fill="#84520d">• 原有工具卡、日期、共享投影保留</text><rect x="18" y="308" width="404" height="238" rx="10" fill="#dff7e7"/><text x="34" y="340" class="h" fill="#1d6b3f">官方推理计费：可选择添加</text><text x="34" y="372" class="b" fill="#1d6b3f">• ERNIE 5.1（¥0.004/千 tokens 起）</text><text x="34" y="399" class="b" fill="#1d6b3f">• ERNIE 5.0（¥0.006/千 tokens 起）</text><text x="34" y="426" class="b" fill="#1d6b3f">• ERNIE 4.5 Turbo 128K</text><text x="34" y="453" class="b" fill="#1d6b3f">• ERNIE 4.5 Turbo VL（¥0.003/千 tokens 输入）</text><text x="34" y="480" class="b" fill="#1d6b3f">• ERNIE X1.1：保留原基线，新增版本需单独映射价格</text><rect x="18" y="566" width="404" height="165" rx="10" fill="#dff7e7"/><text x="34" y="598" class="h" fill="#1d6b3f">图像 / 向量：可选择添加</text><text x="34" y="630" class="b" fill="#1d6b3f">• musesteamer-air-image（¥0.05/张）</text><text x="34" y="657" class="b" fill="#1d6b3f">• Embedding-V1（¥0.0005/千 tokens）</text><text x="34" y="684" class="b" fill="#1d6b3f">• tao-8k（¥0.0005/千 tokens）</text><text x="34" y="711" class="b" fill="#1d6b3f">• bce-reranker-base（¥0.0005/千 tokens）</text><rect x="18" y="751" width="404" height="146" rx="10" fill="#e6e8ed"/><text x="34" y="783" class="h" fill="#4f5968">产品 / 能力边界</text><text x="34" y="815" class="b" fill="#4f5968">• ERNIE-iRAG：按 AI 作画产品计费，作为产品能力</text><text x="34" y="842" class="b" fill="#4f5968">• 语音、AppBuilder、Agent、Coding Plan：不作模型卡</text><text x="34" y="869" class="b" fill="#4f5968">• bce 为第三方托管模型，需标注非百度自研</text></g>
<g transform="translate(530,115)"><rect width="440" height="940" rx="16" fill="#eef5ff" stroke="#6b9ee8" stroke-width="2"/><text x="22" y="40" class="h" fill="#1d4f91">二级：视觉 / OCR（原候选完整保留后筛选）</text><rect x="18" y="58" width="404" height="240" rx="10" fill="#d9eaff"/><text x="34" y="90" class="h" fill="#164b8f">原 SVG 既有候选：保留为审计记录</text><text x="34" y="122" class="b" fill="#164b8f">• ERNIE 4.5 Turbo VL</text><text x="34" y="149" class="b" fill="#164b8f">• Qianfan-VL-70B · Qianfan-VL-8B</text><text x="34" y="176" class="b" fill="#164b8f">• Qianfan-SinglePicOCR · EngCard-VL</text><text x="34" y="203" class="b" fill="#164b8f">• Qianfan-OCR-Fast · Qianfan-OCR</text><text x="34" y="244" class="s" fill="#49627f">其中 ERNIE 4.5 Turbo VL 有推理价格；其余逐模型推理价未核到</text><rect x="18" y="318" width="404" height="248" rx="10" fill="#dff7e7"/><text x="34" y="350" class="h" fill="#1d6b3f">最终可进入 active 的视觉模型</text><text x="34" y="382" class="b" fill="#1d6b3f">• ERNIE 4.5 Turbo VL（含 32K/128K 版本）</text><text x="34" y="409" class="b" fill="#1d6b3f">• ERNIE 5.0 原生多模态版本</text><text x="34" y="436" class="b" fill="#1d6b3f">• 价格页按推理 token 计费</text><text x="34" y="477" class="b" fill="#1d6b3f">• 其余 Qianfan-VL/OCR：暂不进入 active</text><text x="34" y="504" class="b" fill="#1d6b3f">  （开源/训练价格不等于商业推理价格）</text><rect x="18" y="586" width="404" height="190" rx="10" fill="#ffe2e0"/><text x="34" y="618" class="h" fill="#a12b2b">本轮新增剔除</text><text x="34" y="650" class="b" fill="#a12b2b">• Qianfan-VL-70B/8B：仅找到开源或训练价格</text><text x="34" y="677" class="b" fill="#a12b2b">• Qianfan-OCR 系列：未核到模型推理计费</text><text x="34" y="704" class="b" fill="#a12b2b">• FuncCaller：未核到官方模型计费</text><text x="34" y="731" class="b" fill="#a12b2b">• 不能以免费试用额度替代商业计费证据</text><rect x="18" y="796" width="404" height="101" rx="10" fill="#e6e8ed"/><text x="34" y="828" class="h" fill="#4f5968">保留原则</text><text x="34" y="860" class="b" fill="#4f5968">剔除的是新增资格，不删除原 SVG 审计记录</text></g>
<g transform="translate(1020,115)"><rect width="440" height="940" rx="16" fill="#f1edff" stroke="#9076d8" stroke-width="2"/><text x="22" y="40" class="h" fill="#554197">二级：视频 / 向量 / 产品</text><rect x="18" y="58" width="404" height="205" rx="10" fill="#dff7e7"/><text x="34" y="90" class="h" fill="#1d6b3f">可选择添加</text><text x="34" y="122" class="b" fill="#1d6b3f">• musesteamer-air-image（已核到按张计费）</text><text x="34" y="149" class="b" fill="#1d6b3f">• Embedding-V1 · tao-8k</text><text x="34" y="176" class="b" fill="#1d6b3f">• bce-reranker-base（付费托管，但第三方）</text><text x="34" y="221" class="s" fill="#1d6b3f">向量/重排价格：0.0005 元/千 tokens</text><rect x="18" y="283" width="404" height="170" rx="10" fill="#ffe2e0"/><text x="34" y="315" class="h" fill="#a12b2b">本轮剔除</text><text x="34" y="347" class="b" fill="#a12b2b">• MuseSteamer 2.x I2V：未核到明确官方单价</text><text x="34" y="374" class="b" fill="#a12b2b">• Qianfan-VL/OCR：无模型推理价</text><text x="34" y="401" class="b" fill="#a12b2b">• 纯本地开源模型：无商业计费</text><rect x="18" y="473" width="404" height="224" rx="10" fill="#e6e8ed"/><text x="34" y="505" class="h" fill="#4f5968">官方来源</text><text x="34" y="537" class="s" fill="#4f5968">https://cloud.baidu.com/doc/qianfan-docs/s/Jm8r1826a</text><text x="34" y="564" class="s" fill="#4f5968">https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j</text><text x="34" y="591" class="s" fill="#4f5968">https://cloud.baidu.com/doc/qianfan-multimodal/s/nmo74mg17</text><text x="34" y="618" class="s" fill="#4f5968">https://cloud.baidu.com/doc/qianfan/s/zmh4stou3</text><text x="34" y="665" class="b" fill="#4f5968">图为拟定结构；不自动写入正式目录。</text></g></svg>
