<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">智谱AI非纯文本产品与模型二级结构预览</title>
  <desc id="desc">2026年9月7日官方探测预览，区分现有、候选、产品工具、弃用或超 cutoff、待确认。</desc>
  <style>
    .bg{fill:#f7f8fc}.title{font:700 34px "Microsoft YaHei",sans-serif;fill:#182033}.sub{font:18px "Microsoft YaHei",sans-serif;fill:#536078}.section{font:700 22px "Microsoft YaHei",sans-serif;fill:#182033}.text{font:16px "Microsoft YaHei",sans-serif;fill:#263248}.small{font:14px "Microsoft YaHei",sans-serif;fill:#536078}.card{stroke-width:2}.existing{fill:#e8f1ff;stroke:#3973c6}.candidate{fill:#e9f8ee;stroke:#2f9e5b}.product{fill:#f1eaff;stroke:#7b4bb3}.pending{fill:#fff4dc;stroke:#c9821e}.excluded{fill:#fdebec;stroke:#c94c56}.tag{font:700 14px "Microsoft YaHei",sans-serif}.url{font:13px "Segoe UI",sans-serif;fill:#4f6280}
  </style>
  <rect class="bg" width="1600" height="1240"/>
  <text class="title" x="70" y="64">智谱AI：非纯文本能力探测与二级结构预览</text>
  <text class="sub" x="70" y="98">调查日期：2026-09-07　计划 cutoff：2025-07-01　仅为研究 artifact，未修改正式目录</text>
  <rect x="70" y="125" width="1460" height="56" rx="12" fill="#fff" stroke="#d6dbea"/>
  <text class="small" x="92" y="159">图例：</text>
  <rect class="existing" x="175" y="141" width="18" height="18" rx="4"/><text class="small" x="203" y="157">现有目录</text>
  <rect class="candidate" x="315" y="141" width="18" height="18" rx="4"/><text class="small" x="343" y="157">可作为三级模型卡候选</text>
  <rect class="product" x="560" y="141" width="18" height="18" rx="4"/><text class="small" x="588" y="157">产品/工具候选</text>
  <rect class="pending" x="780" y="141" width="18" height="18" rx="4"/><text class="small" x="808" y="157">待确认</text>
  <rect class="excluded" x="955" y="141" width="18" height="18" rx="4"/><text class="small" x="983" y="157">弃用/下线/不纳入</text>

  <text class="section" x="70" y="225">一、当前目录</text>
  <rect class="existing card" x="70" y="245" width="700" height="170" rx="14"/>
  <text class="tag" x="95" y="278" fill="#3973c6">现有二级：GLM 5</text>
  <text class="text" x="95" y="310">三级：GLM-5.1、GLM-5.2、GLM-5.3</text>
  <text class="small" x="95" y="340">现状问题：GLM-5.3 的目录 ID 使用 glm-5-3，</text>
  <text class="small" x="95" y="363">共享 model_key 已使用 zhipu--glm-5.3，需确认全链路规范化。</text>
  <rect class="existing card" x="800" y="245" width="700" height="170" rx="14"/>
  <text class="tag" x="825" y="278" fill="#3973c6">现有二级：GLM 5.3 Flash</text>
  <text class="text" x="825" y="310">三级：GLM-5.3-Flash</text>
  <text class="small" x="825" y="340">现有目录已有卡片；发布日期与共享投影存在待核对差异。</text>
  <text class="small" x="825" y="363">不在本轮 artifact 中直接替换。</text>

  <text class="section" x="70" y="465">二、建议候选：可登记为三级模型卡</text>
  <rect class="candidate card" x="70" y="485" width="350" height="235" rx="14"/>
  <text class="tag" x="95" y="518" fill="#2f9e5b">图像生成</text>
  <text class="text" x="95" y="550">GLM-Image</text><text class="text" x="95" y="578">CogView-4</text>
  <text class="small" x="95" y="620">官方 API + 价格页可核实</text><text class="small" x="95" y="646">不是仅下载权重的本地候选</text>
  <text class="url" x="95" y="682">docs.z.ai/guides/image/...</text>

  <rect class="candidate card" x="445" y="485" width="350" height="235" rx="14"/>
  <text class="tag" x="470" y="518" fill="#2f9e5b">视觉理解 / OCR</text>
  <text class="text" x="470" y="550">GLM-5V-Turbo</text><text class="text" x="470" y="578">GLM-4.6V（系列）</text><text class="text" x="470" y="606">GLM-OCR</text>
  <text class="small" x="470" y="646">图像、视频、文件输入；OCR 有独立 API</text>
  <text class="url" x="470" y="682">docs.z.ai/guides/vlm/...</text>

  <rect class="candidate card" x="820" y="485" width="325" height="235" rx="14"/>
  <text class="tag" x="845" y="518" fill="#2f9e5b">视频生成</text>
  <text class="text" x="845" y="550">CogVideoX-3</text>
  <text class="small" x="845" y="590">文生、图生、首尾帧</text>
  <text class="small" x="845" y="618">官方 API，按视频计费</text>
  <text class="small" x="845" y="646">发布时间 2025-07-15</text>
  <text class="url" x="845" y="682">docs.z.ai/guides/video/...</text>

  <rect class="candidate card" x="1170" y="485" width="330" height="235" rx="14"/>
  <text class="tag" x="1195" y="518" fill="#2f9e5b">音频 / 语音</text>
  <text class="text" x="1195" y="550">GLM-TTS</text><text class="text" x="1195" y="578">GLM-TTS-Clone</text><text class="text" x="1195" y="606">GLM-ASR-2512</text><text class="text" x="1195" y="634">GLM-Realtime</text>
  <text class="small" x="1195" y="670">GLM-4-Voice：待确认状态</text>

  <text class="section" x="70" y="770">三、候选产品 / 工具与平台 API</text>
  <rect class="product card" x="70" y="790" width="470" height="190" rx="14"/>
  <text class="tag" x="95" y="823" fill="#7b4bb3">官方产品 / Harness / Agent</text>
  <text class="text" x="95" y="855">ZCode：官方 GLM-5.3 编程 Harness</text>
  <text class="text" x="95" y="883">AutoClaw：官方 Agent 工作流产品</text>
  <text class="text" x="95" y="911">GLM Coding Plan：订阅产品，不生成工具卡</text>
  <text class="small" x="95" y="947">若纳入 ZCode，先登记 official-product-url-registry</text>

  <rect class="product card" x="565" y="790" width="470" height="190" rx="14"/>
  <text class="tag" x="590" y="823" fill="#7b4bb3">平台 API / Agent 工具</text>
  <text class="text" x="590" y="855">Embedding-3、Embedding-2</text>
  <text class="text" x="590" y="883">Rerank、Moderation</text>
  <text class="text" x="590" y="911">GLM Slide/Poster Agent、Translation Agent</text>
  <text class="text" x="590" y="939">Video Effect Template Agent</text>

  <rect class="pending card" x="1060" y="790" width="440" height="190" rx="14"/>
  <text class="tag" x="1085" y="823" fill="#c9821e">待确认：是否拆成三级卡</text>
  <text class="text" x="1085" y="855">Embedding / Rerank / Moderation</text>
  <text class="text" x="1085" y="883">可作为产品 API，也有 model code</text>
  <text class="text" x="1085" y="911">需按当前 CatalogProfile 决定</text>
  <text class="small" x="1085" y="947">不得仅凭名称自动生成模型卡</text>

  <text class="section" x="70" y="1030">四、排除与生命周期边界</text>
  <rect class="excluded card" x="70" y="1050" width="700" height="120" rx="14"/>
  <text class="tag" x="95" y="1083" fill="#c94c56">已弃用 / 即将下线</text>
  <text class="text" x="95" y="1115">GLM-Z1 系列、GLM-4-0520：官方列为弃用；GLM-4.5-Flash：官方标注即将下线。</text>
  <text class="small" x="95" y="1145">不作为本轮新增候选；如需保留仅进入历史/审计路径。</text>
  <rect class="pending card" x="800" y="1050" width="700" height="120" rx="14"/>
  <text class="tag" x="825" y="1083" fill="#c9821e">超 cutoff / 日期未知</text>
  <text class="text" x="825" y="1115">cutoff = 2025-07-01；早于该日期的候选应级联删除。</text>
  <text class="small" x="825" y="1145">未找到可靠发布日期的旧模型保守保留并记录 warning；ViduQ1/Vidu2 为接入的外部产品，暂不归智谱自有模型。</text>

  <text class="small" x="70" y="1210">官方来源：docs.z.ai/guides/overview/overview · docs.bigmodel.cn/cn/update/new-releases · zcode.z.ai/cn · docs.bigmodel.cn/cn/guide/start/model-overview</text>
</svg>