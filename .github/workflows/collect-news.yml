name: Collect AI News

on:
  schedule:
    # GitHub Actions cron 固定按 UTC；此处统一按「北京时间」换算（UTC = 北京 - 8h）：
    #   YouTube：每天北京 20:00 → UTC 12:00，管线内 72h 到期闸决定是否真正采集
    #   X：热半区每天北京时间 08:30 → UTC 00:30；冷半区每天北京时间 20:30 → UTC 12:30
    - cron: '0 12 * * *'
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: '本次采集平台：both / youtube / x（缺省 both）'
        required: false
        default: both
        type: choice
        options:
          - both
          - youtube
          - x
      pipeline:
        description: '管线：min = 热点管线 v2（v2 已为默认，当前唯一选项）'
        required: false
        default: min
        type: choice
        options:
          - min
      x_slot:
        description: 'X 窗口槽位（platforms 含 x 时生效）：hot=前晚20:00-当日08:00，cold=当日08:00-20:00'
        required: false
        default: hot
        type: choice
        options:
          - hot
          - cold

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect-ai-news
  cancel-in-progress: false

jobs:
  collection_gate:
    if: ${{ vars.NEWS_COLLECTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      config_enabled: ${{ steps.config.outputs.enabled }}
      youtube_due: ${{ steps.config.outputs.youtube_due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 存在开放 Data PR 时，从其分支播种 schedule-state 等六文件，
      # 保证 72h 到期闸按 PR 分支上的最新调度状态判定（而非 main 陈旧基线）。
      - name: Sync open Data PR baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deliver-news-data-pr.js --sync-baseline

      - name: Resolve versioned collection switch
        id: config
        env:
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { loadV2Config, isCollectionEnabled, isYoutubeDue } = require('./src/news/min/pipeline-min');
          const config = loadV2Config();
          const enabled = isCollectionEnabled(config);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          console.log(`Versioned collection switch: ${enabled ? 'enabled' : 'disabled'}`);
          let youtubeDue = true;
          if (enabled && process.env.GITHUB_SCHEDULE === '0 12 * * *') {
            let state = null;
            try { state = JSON.parse(fs.readFileSync('data/news/runtime/schedule-state.json', 'utf8')); } catch {}
            youtubeDue = isYoutubeDue(config, state, new Date());
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `youtube_due=${youtubeDue}\n`);
          console.log(`YouTube due precheck: ${youtubeDue}`);
          NODE

  collect:
    needs: collection_gate
    if: ${{ needs.collection_gate.result == 'success' && needs.collection_gate.outputs.config_enabled == 'true' && needs.collection_gate.outputs.youtube_due != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source configuration
        run: node scripts/validate.js

      - name: Secret scan guard
        run: node scripts/check-secrets.js

      # 存在开放 Data PR 时，先从其分支播种六文件作为管线读入基线，
      # 管线自身的记录级幂等合并在此基线上继续（§8.7），避免按 main 陈旧基线覆盖 PR 分支状态。
      - name: Sync open Data PR baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deliver-news-data-pr.js --sync-baseline

      - name: Resolve platforms
        env:
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
          X_SLOT_INPUT: ${{ github.event.inputs.x_slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$PLATFORMS_INPUT" ]]; then
            if [[ "$PLATFORMS_INPUT" == "both" ]]; then
              echo "NEWS_PLATFORMS=youtube,x" >> "$GITHUB_ENV"
            else
              echo "NEWS_PLATFORMS=$PLATFORMS_INPUT" >> "$GITHUB_ENV"
            fi
            # dispatch 携带 x 平台时显式传槽位，避免 X 因缺 slot 而失败
            if [[ "$PLATFORMS_INPUT" == *x* ]]; then
              echo "NEWS_X_SLOT=${X_SLOT_INPUT:-hot}" >> "$GITHUB_ENV"
            fi
          elif [[ "$SCHEDULE" == "30 0 * * *" ]]; then
            echo "NEWS_PLATFORMS=x" >> "$GITHUB_ENV"
            echo "NEWS_X_SLOT=hot" >> "$GITHUB_ENV"
          elif [[ "$SCHEDULE" == "30 12 * * *" ]]; then
            echo "NEWS_PLATFORMS=x" >> "$GITHUB_ENV"
            echo "NEWS_X_SLOT=cold" >> "$GITHUB_ENV"
          elif [[ "$SCHEDULE" == "0 12 * * *" ]]; then
            echo "NEWS_PLATFORMS=youtube" >> "$GITHUB_ENV"
          else
            echo "NEWS_PLATFORMS=x" >> "$GITHUB_ENV"
            echo "NEWS_X_SLOT=hot" >> "$GITHUB_ENV"
          fi

      - name: Collect and build news
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then FLAGS="--scheduled"; fi
          if [[ -n "$NEWS_X_SLOT" ]]; then
            node scripts/build-news.js --platforms "$NEWS_PLATFORMS" $FLAGS --slot "$NEWS_X_SLOT"
          else
            node scripts/build-news.js --platforms "$NEWS_PLATFORMS" $FLAGS
          fi

      - name: Record collection summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const { formatRunSummary } = require('./src/news/min/pipeline-schedule');
          const path = 'data/news/runtime/last-run.json';
          if (!fs.existsSync(path)) {
            console.log('## 热点采集摘要\n本次没有可用的 last-run.json 记录。');
            process.exit(0);
          }
          try {
            const run = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(formatRunSummary(run));
          } catch (error) {
            console.log(`## 热点采集摘要\n读取记录失败：${error.message}`);
          }
          NODE

      - name: Test generated data
        run: |
          node --test tests/news/collector-x-v2.test.js tests/news/news-pipeline-min.test.js tests/news/news-rss.test.js tests/news/news-public-gate.test.js tests/news/news-reviewer.test.js tests/news/news-summarizer.test.js tests/news/news-localizer.test.js tests/news/content-classifier-llm.test.js tests/news/news-data-pr-delivery.test.js tests/news/deliver-news-data-pr-script.test.js tests/maintenance/validate-news-config.test.js
          node scripts/validate.js

      - name: Deliver news data PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deliver-news-data-pr.js \
            --output "$GITHUB_OUTPUT" \
            --commit-message "chore(data): update news runtime data"

      # 公开投影在审核 PR 合并后由 publish-news.yml 重建，不在此直接提交 main。
